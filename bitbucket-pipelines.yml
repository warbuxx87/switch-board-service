image:                               atlassian/default-image:2

pipelines:
  default:
    - step:
        name:                        "Build and Test"
        deployment:                  test
        script:
          - echo "Build, Upload and Test!"
          - zip -r docker-multicontainer-v2.zip .
          - pipe:                    atlassian/aws-elasticbeanstalk-deploy:0.2.3
            variables:
              AWS_ACCESS_KEY_ID:     $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION:    $AWS_DEFAULT_REGION
              APPLICATION_NAME:      'switch-board-service'
              COMMAND:               'upload-only'
              ZIP_FILE:              'docker-multicontainer-v2.zip'
              VERSION_LABEL:         'switch-board-service-$BITBUCKET_BUILD_NUMBER'
        artifacts:
        - docker-multicontainer-v2.zip
    - step:
        name:                        "Deploy to Staging"
        deployment:                  staging
        script:
        - echo "Deployment to Staging!"
        - pipe:                      atlassian/aws-elasticbeanstalk-deploy:0.2.3
          variables:
            AWS_ACCESS_KEY_ID:       $AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY:   $AWS_SECRET_ACCESS_KEY
            AWS_DEFAULT_REGION:      $AWS_DEFAULT_REGION
            APPLICATION_NAME:        'switch-board-service'
            COMMAND:                 'deploy-only'
            VERSION_LABEL:           'switch-board-service-$BITBUCKET_BUILD_NUMBER'
            ENVIRONMENT_NAME:        'switch-board-multi-docker'
            WAIT:                    'true'
    - step:
        name:                        "Deploy to Production"
        deployment:                  production
        trigger:                     manual
        script:
          - echo "Deployment to Production!"
          - pipe:                    atlassian/aws-elasticbeanstalk-deploy:0.2.3
            variables:
              AWS_ACCESS_KEY_ID:     $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION:    $AWS_DEFAULT_REGION
              APPLICATION_NAME:      'switch-board-service'
              COMMAND:               'deploy-only'
              VERSION_LABEL:         'switch-board-service-$BITBUCKET_BUILD_NUMBER'
              ENVIRONMENT_NAME:      'service-production'
              WAIT:                  'true'
