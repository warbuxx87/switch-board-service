version:                   "3.1"
services:
  database:
    image:                 mysql:5.7
    restart:               always
    container_name:        "switch_database"
    environment:
      MYSQL_PASSWORD:      dbpassword
      MYSQL_DATABASE:      switchboarddb
      MYSQL_ROOT_PASSWORD: switchpassword
      command:             --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - /Users/ryanbreen/mnt/db_data:/mnt/db_data
  switch-board-service:
    build:                 .
    ports:
      - "7020:7020"
    restart:               on-failure
    depends_on:
      - database
